name: Test
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master, next, next-major, beta, alpha]
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
